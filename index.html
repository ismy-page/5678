<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olivia Dunham — Attorney at Law</title>
    <meta name="description" content="Commercial & civil litigation. Helping clients resolve disputes with clarity and speed." />

    <!-- Typeface (optional, lightweight) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Local styles -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="top">
      <!-- Profile card -->
      <section class="card" aria-labelledby="lawyer-name">
        <!-- Left: dark info panel -->
        <div class="card__left">
          <div class="left__content">
            <p class="role">Attorney at Law</p>
            <h1 id="lawyer-name" class="name">Olivia Dunham</h1>
            <span aria-hidden="true" class="name-underline"></span>
            <p class="bio">
              Commercial & civil litigation. Helping clients resolve disputes with clarity and speed. 
              Practical counsel, precise advocacy.
            </p>
            <a class="cta" href="mailto:olivia@example.com?subject=Consultation%20Request" aria-label="Schedule a consultation via email">
              <span>Schedule a consultation</span>
              <svg class="cta__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M5 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>

          <div class="left__social" aria-label="Social links">
            <a class="social" href="#" aria-label="LinkedIn">
              <span class="sr-only">LinkedIn</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="2" opacity="0.25"/>
                <path d="M8.5 10h2v6h-2v-6Zm1-3a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Zm3 3h1.9v.9h.03c.26-.47 1-1.05 2.07-1.05 2.21 0 2.62 1.36 2.62 3.12V16h-2v-2.6c0-.62-.01-1.42-.87-1.42-.87 0-1 0.68-1 1.37V16h-2v-6Z" fill="currentColor"/>
              </svg>
            </a>
            <a class="social" href="mailto:olivia@example.com" aria-label="Email">
              <span class="sr-only">Email</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="2" opacity="0.25"/>
                <path d="M5 8.5h14v7A1.5 1.5 0 0 1 17.5 17h-11A1.5 1.5 0 0 1 5 15.5v-7Z" stroke="currentColor" stroke-width="2"/>
                <path d="M5 9l7 5 7-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
            <a class="social" href="#" aria-label="Twitter / X">
              <span class="sr-only">Twitter / X</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="2" opacity="0.25"/>
                <path d="M6.5 6.5h2.2l3.1 4.2 3.5-4.2h2l-4.6 5.4 4.8 6.1h-2.2l-3.3-4.3-3.6 4.3H7l4.9-5.8L6.5 6.5Z" fill="currentColor"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- Right: portrait image area -->
        <div class="card__right" role="img" aria-label="Portrait area. Replace with a real photo by changing background-image in CSS."></div>
      </section>
    </main>

    <!-- Local script (kept intentionally light) -->
    <script src="./script.js" defer></script>
  </body>
</html>
